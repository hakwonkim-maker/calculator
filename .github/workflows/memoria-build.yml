# MEMORIA 기념영상 스튜디오 — Windows 설치 파일(.exe) 빌드
# Actions 탭에서 수동 실행하거나 memory-film/ 변경 시 자동 실행됩니다.
name: MEMORIA Windows Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'memory-film/**'
      - '.github/workflows/memoria-build.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: memory-film
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memory-film/package-lock.json
      - run: npm ci
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MEMORIA-Film-Studio-Windows
          path: memory-film/release/*.exe
          if-no-files-found: error
