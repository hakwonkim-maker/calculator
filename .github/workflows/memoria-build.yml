# MEMORIA 기념영상 스튜디오 — Windows 설치 파일(.exe) 빌드
# Actions 탭에서 수동 실행하거나 memory-film/ 변경 시 자동 실행됩니다.
name: MEMORIA Windows Installer

on:
  workflow_dispatch:
  push:
    # tags만 지정하면 브랜치 push에서는 실행되지 않으므로 branches도 함께 지정
    branches:
      - '**'
    paths:
      - 'memory-film/**'
      - '.github/workflows/memoria-build.yml'
    tags:
      - 'memoria-v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: memory-film
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: memory-film/package-lock.json
      - run: npm ci
      # 무료 음악 30곡(퍼블릭 도메인 클래식 + CC BY) — 다 받은 경우에만 캐시에 보관해 다음 빌드부터 다시 받지 않음
      - name: Restore music library cache
        id: music-cache
        uses: actions/cache/restore@v4
        with:
          path: memory-film/music-library
          key: memoria-music-v4
      - name: Fetch free music library (PD classical + CC BY)
        id: music
        run: node scripts/fetch-music.cjs
      - name: Save music library cache
        if: steps.music-cache.outputs.cache-hit != 'true' && steps.music.outputs.count >= 30
        uses: actions/cache/save@v4
        with:
          path: memory-film/music-library
          key: memoria-music-v4
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: MEMORIA-Film-Studio-Windows
          path: memory-film/release/*.exe
          if-no-files-found: error
      # 'memoria-v1.1.0' 같은 태그를 올리면 Releases 페이지에 설치 파일이 게시됩니다 (로그인 없이 다운로드 가능)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/memoria-v')
        uses: softprops/action-gh-release@v2
        with:
          files: memory-film/release/*.exe
